services:
  db:
    image: postgres:17-alpine
    container_name: byggepartner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: byggepartner
      POSTGRES_PASSWORD: byggepartner
      POSTGRES_DB: byggepartner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byggepartner"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
